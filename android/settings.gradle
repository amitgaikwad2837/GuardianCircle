pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'GuardianCircle'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-nitro-image has no codegenConfig so it is not picked up by
// autolinkLibrariesFromCommand(); include it manually so vision-camera can resolve it.
include ':react-native-nitro-image'
project(':react-native-nitro-image').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-nitro-image/android')
