// Load local signing credentials (gradle.properties.local is gitignored)
def localPropsFile = rootProject.file("gradle.properties.local")
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
    localProps.each { key, value -> project.ext.set(key, value) }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// google-services must be last — requires google-services.json in app/
apply plugin: "com.google.gms.google-services"

react {
    entryFile = file("../../index.js")
    // Hermes is controlled by hermesEnabled=true in gradle.properties (RN 0.71+)
    // hermesFlags = ["-O", "-output-source-map"]

    // Required: tells RNGP to add autolinking library projects as Gradle dependencies.
    // Without this, PackageList.java compiles but the library classes are missing.
    autolinkLibrariesWithApp()
}

android {
    ndkVersion        rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk        rootProject.ext.compileSdkVersion
    namespace         "com.guardiancircle.app"

    defaultConfig {
        applicationId          "com.guardiancircle.app"
        minSdk                 rootProject.ext.minSdkVersion
        targetSdk              rootProject.ext.targetSdkVersion
        versionCode            1
        versionName            "1.0.0"
        multiDexEnabled        true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Required by react-native-permissions for compile-time opt-in
        manifestPlaceholders = [
            appAuthRedirectScheme: "com.guardiancircle.app"
        ]
    }

    signingConfigs {
        debug {
            storeFile     file('debug.keystore')
            storePassword 'android'
            keyAlias      'androiddebugkey'
            keyPassword   'android'
        }
        release {
            // Credentials injected via gradle.properties or CI environment variables.
            // Never commit keystore credentials to source control.
            if (project.hasProperty('GUARDIAN_RELEASE_STORE_FILE')) {
                storeFile     file(GUARDIAN_RELEASE_STORE_FILE)
                storePassword GUARDIAN_RELEASE_STORE_PASSWORD
                keyAlias      GUARDIAN_RELEASE_KEY_ALIAS
                keyPassword   GUARDIAN_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable    true
            // No minification in debug — speeds up builds and allows JS sourcemaps
            minifyEnabled false
        }
        release {
            signingConfig  signingConfigs.release
            debuggable     false
            minifyEnabled  true
            shrinkResources true
            proguardFiles  getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    // Avoid duplicate native library conflicts from transitive dependencies
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so', '**/libfbjni.so']
        }
    }
}

dependencies {
    // React Native core — versions managed by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Kotlin standard library
    implementation("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")

    // MultiDex — required when method count exceeds 64K (common with RN + Firebase)
    implementation("androidx.multidex:multidex:2.0.1")

    // Location — FusedLocationProviderClient for high-accuracy GPS
    implementation("com.google.android.gms:play-services-location:21.3.0")

    // WorkManager — for BackgroundTaskModule deferred work
    implementation("androidx.work:work-runtime-ktx:2.9.1")

    // Biometric / hardware-backed key prompts
    implementation("androidx.biometric:biometric:1.1.0")

    // Core KTX utilities
    implementation("androidx.core:core-ktx:1.13.1")

    // Splash screen API — required for Theme.SplashScreen in styles.xml
    implementation("androidx.core:core-splashscreen:1.0.1")

    // Firebase — BOM pins all Firebase library versions consistently
    implementation(platform("com.google.firebase:firebase-bom:33.3.0"))
    implementation("com.google.firebase:firebase-messaging-ktx")
    // firebase-analytics intentionally excluded per ADR-007 (no analytics SDK)

    // Instrumentation tests
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
}
